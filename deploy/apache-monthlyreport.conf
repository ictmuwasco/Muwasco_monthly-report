#
# MUWASCO Monthly Report — single-origin deployment (Apache / XAMPP)
#   DocumentRoot serves the built React SPA (frontend-react/dist)
#   /api is proxied to the Laravel backend (php artisan serve --port=8000)
#
# SPA fallback: unknown paths return index.html so client-side routes
# (/login, /users, ...) survive hard refresh / direct entry.
#
<VirtualHost *:80>
    ServerAdmin webmaster@muwasco.local
    ServerName monthlyreport.local
    DocumentRoot "/opt/lampp/htdocs/monthly_report/frontend-react/dist"

    ProxyPreserveHost On
    ProxyPass        /api  http://127.0.0.1:8000/api retry=0
    ProxyPassReverse /api  http://127.0.0.1:8000/api

    # Stop parent-directory .htaccess files (e.g. the legacy PHP one in
    # htdocs/monthly_report) from applying to the SPA.
    <Directory "/opt/lampp/htdocs/monthly_report">
        AllowOverride None
        Require all granted
    </Directory>

    <Directory "/opt/lampp/htdocs/monthly_report/frontend-react/dist">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        FallbackResource /index.html
    </Directory>

    ErrorLog  "logs/monthlyreport-error_log"
    CustomLog "logs/monthlyreport-access_log" combined
</VirtualHost>
